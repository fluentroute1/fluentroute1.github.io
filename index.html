<style>
/* Layout: app shell. Ink header band (brand, language + accent switches, progress ring); one column of views; tab bar fixed at the bottom on phones, sticky on top on desktop */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --sunk:#F5F7FB; --ink:#121935; --muted:#5D6684; --line:#DCE1EC;
  --band:#121935; --band-fg:#F4F6FC; --band-muted:#A9B1CF; --band-line:rgba(255,255,255,.16);
  --accent:#2F4FE0; --accent-soft:#E4E9FF; --marker:#FFD84A; --marker-ink:#121935;
  --ok:#17885A; --ok-soft:#DDF3E8; --bad:#C9373B; --bad-soft:#FBE3E3;
  --f-display:"Baloo Bhaijaan 2","Readex Pro","Segoe UI",Tahoma,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"Readex Pro","Segoe UI",Tahoma,sans-serif; /* numbers use tabular figures, no code font */
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#151C32; --sunk:#10162A; --ink:#E8ECF6; --muted:#98A1BE; --line:#262F4C;
  --band:#151C32; --band-fg:#F4F6FC; --band-muted:#98A1BE; --band-line:rgba(255,255,255,.12);
  --accent:#8FA3FF; --accent-soft:#222C55; --marker:#F2CC3D; --marker-ink:#121935;
  --ok:#4BC48A; --ok-soft:#173A2B; --bad:#FF7A7E; --bad-soft:#3E1B22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#151C32; --sunk:#10162A; --ink:#E8ECF6; --muted:#98A1BE; --line:#262F4C;
  --band:#151C32; --band-fg:#F4F6FC; --band-muted:#98A1BE; --band-line:rgba(255,255,255,.12);
  --accent:#8FA3FF; --accent-soft:#222C55; --marker:#F2CC3D; --marker-ink:#121935;
  --ok:#4BC48A; --ok-soft:#173A2B; --bad:#FF7A7E; --bad-soft:#3E1B22; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);text-align:start}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.en{unicode-bidi:isolate;font-family:var(--f-display)}
.ltr{direction:ltr;text-align:left}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font:700 20px/1.35 var(--f-body);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.sec-head:first-child{margin-top:0}
.sec-head small{color:var(--muted);font-size:13px}

/* motion */
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:.001}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@keyframes shimmer{to{background-position:-200% 0}}
.view{animation:rise .38s var(--ease) both}
.stagger>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* header band */
header{background:var(--band);color:var(--band-fg)}
header .wrap{padding-block:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body{font-variant-numeric:tabular-nums}
.brand{flex:1;min-width:150px;display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;flex:none;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.brand b{display:block;font:800 28px/1 var(--f-display);letter-spacing:-.01em;padding-top:4px}
.brand b span{color:var(--marker)}
.brand small{color:var(--band-muted);font-size:13px}
.switches{display:flex;gap:8px}
@media (max-width:520px){.switches{order:3;flex-basis:100%}}
.seg{display:inline-flex;border:1px solid var(--band-line);border-radius:99px;padding:2px}
.seg button{border:0;background:transparent;color:var(--band-muted);padding:4px 10px;border-radius:99px;font:500 13px var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--band-fg);color:var(--band)}
.ring{--p:0;width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--marker) calc(var(--p)*1%),var(--band-line) 0);transition:--p .8s}
.ring div{width:47px;height:47px;border-radius:50%;background:var(--band);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring strong{font:600 16px var(--f-display)}
.ring em{font:normal 10px var(--f-mono);color:var(--band-muted)}

/* nav */
nav{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:8px 6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
nav a[aria-current="page"]{color:var(--accent)}
nav a[aria-current="page"] svg{transform:translateY(-2px)}
main .wrap{padding-block:22px 110px}
@media (min-width:760px){
  nav{position:sticky;top:env(safe-area-inset-top,0px);inset-inline:auto;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  nav .wrap{display:flex;gap:6px;padding-block:8px}
  nav a{flex-direction:row;gap:8px;font-size:15px;padding:8px 14px;border-radius:99px}
  nav a[aria-current="page"]{background:var(--accent-soft)}
  nav a[aria-current="page"] svg{transform:none}
  nav svg{width:18px;height:18px}
  main .wrap{padding-block:28px 64px}
}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--surface);transition:transform .15s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--ok);color:#fff}
.btn.big{padding:16px 22px;font-size:17px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* today */
.now{display:grid;gap:12px}
.lvl{display:flex;align-items:center;gap:14px}
.badge{font:700 22px/1 var(--f-display);background:var(--marker);color:var(--marker-ink);border-radius:12px;padding:12px;min-width:64px;text-align:center}
.line{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.line i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .6s var(--ease)}
.next{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.next b{color:var(--accent);flex:none}
.cta{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7b3fe4));color:#fff;border-radius:var(--r);padding:18px}
.cta p{opacity:.85;font-size:14px}
.cta .btn{background:#fff;color:#1b2559}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:background .25s,border-color .25s}
.task.done{background:var(--ok-soft);border-color:transparent}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s var(--ease)}
.tick svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3}
.task:not(.done) .tick svg{opacity:0}
.t-title{font-weight:700}
.t-sub{display:block;font-size:14px;color:var(--muted)}
.mins{font:500 13px var(--f-mono);color:var(--muted)}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
.stat strong{display:block;font:700 28px/1.1 var(--f-display)}
.stat span{font-size:14px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}

/* stages */
.stages{display:grid;gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stage summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.stage summary::-webkit-details-marker{display:none}
.code{font:700 15px/1 var(--f-display);width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--sunk)}
.stage.current .code{background:var(--marker);color:var(--marker-ink)}
.stage.done .code{background:var(--ok);color:#fff}
.s-name{font-weight:700;font-size:17px;display:block}
.s-meta{font-size:13px;color:var(--muted)}
.s-count{font:500 13px var(--f-mono);color:var(--muted)}
.s-body{display:grid;gap:16px;border-top:1px solid var(--line);padding:16px 16px 18px}
.label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.checks input{margin:4px 0 0;width:20px;height:20px;accent-color:var(--ok);flex:none}
.checks input:checked+span{color:var(--muted);text-decoration:line-through}
.picks,.list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.list{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.more{justify-self:start;font-weight:700;text-decoration:none}
.honest{border-inline-start:4px solid var(--marker);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px}

/* resources */
.item{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;min-width:0;transition:border-color .2s,transform .2s var(--ease)}
a.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .en{font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--muted);font-size:13px}
.tag{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}

/* chips + segmented tabs */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:14px;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* tips */
.methods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.methods .panel{padding:14px 16px}
.methods strong{display:block;margin-bottom:2px}
.methods p{color:var(--muted);font-size:15px}
.pairs{display:flex;flex-wrap:wrap;gap:8px}
.pair{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.pair button{border:0;background:transparent;padding:7px 12px}
.pair button+button{border-inline-start:1px solid var(--line);color:var(--muted);font-size:12px}
.pair button:hover{background:var(--accent-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:13px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td button{border:0;background:transparent;padding:0;color:var(--accent);font-family:var(--f-display);font-weight:600}

/* flashcard flip */
.flip{perspective:1200px}
.flip-in{position:relative;min-height:270px;transition:transform .55s var(--ease);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.face.back{transform:rotateY(180deg)}
.word{font:800 clamp(30px,8vw,42px)/1.15 var(--f-display)}
.word span{background:linear-gradient(transparent 58%,var(--marker) 58%);padding:0 .1em}
.ex{font-size:17px;color:var(--muted);font-family:var(--f-display)}
.ar{font-size:21px;font-weight:700}
.kind{font:500 12px var(--f-mono);color:var(--muted)}
.empty-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:40px 20px;text-align:center;display:grid;gap:6px}

/* speak */
.speak-card{display:grid;gap:16px;text-align:center;justify-items:center}
.target{font:600 clamp(20px,5vw,26px)/1.45 var(--f-display);max-width:32ch}
.target span{transition:color .25s,background .25s;border-radius:4px;padding:0 .08em}
.target .hit{color:var(--ok)}
.target .miss{color:var(--bad);background:var(--bad-soft)}
.mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.mic svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mic:active{transform:scale(.94)}
.mic.rec{background:var(--bad);animation:pulse 1.1s infinite}
.heard{min-height:1.6em;color:var(--muted);font-family:var(--f-display)}
.score{font:800 44px/1 var(--f-display);animation:pop .45s var(--ease)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;text-align:start}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.statgrid div{background:var(--sunk);border-radius:12px;padding:10px}
.statgrid strong{display:block;font:700 22px var(--f-display)}
.statgrid span{font-size:12px;color:var(--muted)}
.timer{font:500 15px var(--f-mono);color:var(--muted)}

/* test */
.t-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.t-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.t-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--marker));transition:width .4s var(--ease)}
.q{font:600 clamp(19px,4.6vw,23px)/1.5 var(--f-display);margin-bottom:18px}
.q .gap{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);height:1em;vertical-align:baseline}
.passage{background:var(--sunk);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-family:var(--f-display);line-height:1.6}
.opts{display:grid;gap:8px}
.opt{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font:500 17px var(--f-display);transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .35s var(--ease)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;font:500 18px/1.5 var(--f-display);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.review{display:grid;gap:8px;text-align:start}
.review li{list-style:none;background:var(--sunk);border-radius:12px;padding:12px 14px;font-family:var(--f-display)}
.review ul{margin:0;padding:0;display:grid;gap:8px}
.review summary{cursor:pointer;font-weight:700}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.lex{font:800 clamp(34px,10vw,52px)/1.1 var(--f-display);text-align:center;padding:36px 0;animation:pop .3s var(--ease)}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);display:grid;place-items:center;margin:0 auto 10px}
.play svg{width:34px;height:34px;fill:currentColor}
.result-badge{font:800 72px/1 var(--f-display);color:var(--marker-ink);background:var(--marker);border-radius:24px;width:150px;height:150px;display:grid;place-items:center;margin:0 auto;animation:pop .7s var(--ease)}
.bars{display:grid;gap:12px}
.bars .b{display:grid;gap:4px}
.bars .b div:first-child{display:flex;justify-content:space-between;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);font:500 11px var(--f-mono);color:var(--muted);text-align:center}
.intro-list{display:grid;gap:10px;counter-reset:s;margin:0;padding:0;list-style:none}
.intro-list li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--sunk);border-radius:12px;padding:12px 14px}

// Adaptive test: 3-parameter-style model with fixed guessing (4 options), EAP ability estimate on a grid
const GRID=[];for(let t=-4;t<=4.0001;t+=0.1)GRID.push(+t.toFixed(1));
const GUESS=0.25;
const pCorrect=(th,b)=>GUESS+(1-GUESS)/(1+Math.exp(-1.7*(th-b)));
function eap(resp){ // resp: [{b, ok}] -> {theta, sd}
  const w=GRID.map(t=>{let l=Math.exp(-t*t/(2*2.25));for(const r of resp){const p=pCorrect(t,r.b);l*=r.ok?p:1-p}return l});
  const den=w.reduce((a,b)=>a+b,0);
  const m=GRID.reduce((a,t,i)=>a+t*w[i],0)/den;
  return {theta:m,sd:Math.sqrt(GRID.reduce((a,t,i)=>a+(t-m)**2*w[i],0)/den)};
}
const bOf=(lvl,j)=>lvl-2.5+((j%5)-2)*0.12;              // A1..C2 centred at -2.5..2.5
const thetaScore=th=>Math.max(0,Math.min(5.99,th+3));    // continuous 0..6; floor = level index
function pickItem(bank,used,theta){
  let best=-1,bd=1e9;
  bank.forEach((it,i)=>{if(used.has(i))return;const d=Math.abs(it.b-theta)+Math.random()*0.2;if(d<bd){bd=d;best=i}});
  return best;
}
// Vocabulary: per-band hit rate corrected by false alarms on made-up words, scaled to Milton's 5,000-word CEFR bands
const VCUTS=[0,1500,2500,3250,3750,4500,5000];
function vocabScore(ans){ // ans: [{band, yes}]
  const rate=b=>{const a=ans.filter(x=>x.band===b);return a.length?a.filter(x=>x.yes).length/a.length:0};
  const fa=rate(0);
  const adj=b=>fa>=0.99?0:Math.max(0,Math.min(1,(rate(b)-fa)/(1-fa)));
  const size=Math.round([1,2,3,4,5].reduce((s,b)=>s+adj(b)*1000,0));
  const rare=adj(6);
  let score;
  if(size>=4500)score=rare>=0.6?5+Math.min(0.99,(rare-0.6)/0.4):4.99;
  else{let i=0;while(size>=VCUTS[i+1])i++;score=i+(size-VCUTS[i])/(VCUTS[i+1]-VCUTS[i])}
  return {size,rare,fa,score:Math.min(5.99,score)};
}
function overall(v,u,l){ // weighted by how much each section tells us
  const s=0.45*u.score+0.30*l.score+0.25*v.score;
  const spread=Math.max(u.score,l.score,v.score)-Math.min(u.score,l.score,v.score);
  const conf=(spread<1.2&&u.sd<0.7&&v.fa<0.25)?'high':(spread<2&&v.fa<0.4)?'mid':'low';
  return {score:s,level:Math.floor(s),conf};
}
// Speaking: longest common subsequence between target words and what the mic heard
const toWords=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
function matchWords(target,heard){
  const n=target.length,m=heard.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=target[i]===heard[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(target[i]===heard[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return hit;
}
(function selfCheck(){
  const sim=trueTh=>{const bank=UOE.map((x,j)=>({b:bOf(x[0],j)}));const used=new Set(),resp=[];let th=-0.5;
    for(let k=0;k<16;k++){const i=pickItem(bank,used,th);used.add(i);resp.push({b:bank[i].b,ok:bank[i].b<trueTh});th=eap(resp).theta}
    return Math.floor(thetaScore(th))};
  console.assert(sim(9)===5,'cat: all correct -> C2');
  console.assert(sim(-9)===0,'cat: all wrong -> A1');
  console.assert(sim(0.5)===3,'cat: B2 responder -> B2');
  const allYes=VOCAB.map(([band])=>({band,yes:true}));
  console.assert(vocabScore(allYes).size===0,'vocab: saying yes to everything scores 0');
  const honest=VOCAB.map(([band])=>({band,yes:band>=1&&band<=3}));
  console.assert(Math.floor(vocabScore(honest).score)===2,'vocab: knows 3,000 words -> B1');
  console.assert(matchWords(['i','like','tea'],['i','tea']).join()===[true,false,true].join(),'speak: word match');
})();

function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}

const accentLang=a=>(a||S.accent)==='uk'?'en-GB':'en-US';
function say(text,{slow=false,rate,accent,onend,vary=false}={}){
  if(!('speechSynthesis' in window)){onend&&onend();return}
  speechSynthesis.cancel();
  const lang=accentLang(accent),re=new RegExp(lang.replace('-','[-_]'),'i');
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate||(slow?.7:.95);
  const all=voices.filter(v=>re.test(v.lang));
  const v=vary&&all.length?all[Math.floor(Math.random()*all.length)]:(all.find(v=>/natural|neural|google|aria|jenny|guy|sonia|ryan|libby/i.test(v.name))||all[0]);
  if(v)u.voice=v;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,{slow:!!b.dataset.slow,accent:b.dataset.accent})});

/* speech in */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen({continuous=false,onText,onEnd,onError}){
  const r=new SR();r.lang=accentLang();r.interimResults=true;r.continuous=continuous;r.maxAlternatives=1;
  let finalText='';
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}onText(finalText+interim)};
  r.onerror=e=>onError&&onError(e.error);
  r.onend=()=>onEnd&&onEnd(finalText.trim());
  try{r.start()}catch(e){onError&&onError('start')}
  return r;
}

      <button class="play" id="earPlay" aria-label="${L('شغّل','Play')}"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="yn" style="width:100%;margin-top:0">${q.pair.map(w=>`<button class="opt ${q.picked?(w===q.word?'right':w===q.picked?'wrong':''):''}" data-ear="${w}" dir="ltr" style="text-align:center" ${q.picked?'disabled':''}>${w}</button>`).join('')}</div>
      ${q.picked?`<p class="muted">${q.picked===q.word?L('صح!','Correct!'):L(`الكلمة كانت "${q.word}"`,`It was "${q.word}"`)}</p><div class="row"><button class="btn ghost" data-say="${q.pair[0]}" data-accent="${S.accent}">${q.pair[0]}</button><button class="btn ghost" data-say="${q.pair[1]}">${q.pair[1]}</button><button class="btn" id="earNext">${L('اللي بعدها','Next')}</button></div>`:''}`}
      </div>`;
  }
}
// Dictation pool: practice sentences + listening clips of the chosen level
const dictPool=lv=>SENTS[lv].concat(LISTEN.filter(x=>x[0]===lv).map(x=>x[1]));
// Ear training: minimal pairs Arabic speakers confuse; each play uses a random voice of the accent (high-variability training)
const EAR=[['pin','bin'],['pea','bee'],['park','bark'],['very','berry'],['fan','van'],['fine','vine'],['think','sink'],['three','tree'],['thin','tin'],['ship','sheep'],['sit','seat'],['live','leave'],['full','fool'],['pull','pool'],['bed','bad'],['cat','cut'],['walk','work'],['hat','hut'],['cap','cup'],['letter','litter']];
const EAR_ROUND=10;
function newEar(){const p=shuffle(EAR)[0];return {pair:p,word:p[Math.random()<.5?0:1],picked:null,n:sp.ear?.n>=EAR_ROUND?0:(sp.ear?.n||0),right:sp.ear?.n>=EAR_ROUND?0:(sp.ear?.right||0)}}
function stopRec(){if(sp.rec){try{sp.rec.stop()}catch(e){}}}
$('v-speak').addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]'),lv=e.target.closest('[data-slv]');
  if(m){stopRec();sp={...sp,mode:m.dataset.mode,heard:'',result:null,err:'',secs:0,dTyped:'',dCheck:false};renderSpeak();return}
  if(lv){stopRec();sp={...sp,lv:+lv.dataset.slv,idx:0,prompt:0,heard:'',result:null,err:'',secs:0,dIdx:0,dTyped:'',dCheck:false};renderSpeak();return}
  const id=e.target.closest('button')?.id;
  // dictation
  const dTarget=()=>{const p=dictPool(speakLevel());return p[sp.dIdx%p.length]};
  if(id==='dPlay'){say(dTarget());return}
  if(id==='dSlow'){say(dTarget(),{slow:true});return}
  if(id==='dCheck'){sp.dCheck=true;renderSpeak();return}
  if(id==='dRetry'){sp.dCheck=false;sp.dTyped='';renderSpeak();$('dInput')?.focus();return}
  if(id==='dNext'){sp.dIdx++;sp.dCheck=false;sp.dTyped='';renderSpeak();say(dTarget());return}
  // ear training
  const ew=e.target.closest('[data-ear]');
  if(ew&&sp.ear&&!sp.ear.picked){sp.ear.picked=ew.dataset.ear;sp.ear.n++;if(sp.ear.picked===sp.ear.word)sp.ear.right++;renderSpeak();return}
  if(id==='earPlay'){say(sp.ear.word,{vary:true});return}
  if(id==='earNext'){sp.ear=newEar();renderSpeak();say(sp.ear.word,{vary:true});return}
  if(id==='earNew'){sp.ear=null;renderSpeak();return}
  if(id==='nextSent'){sp={...sp,idx:sp.idx+1,heard:'',result:null,err:''};renderSpeak();return}
  if(id==='again2'){sp={...sp,heard:'',result:null,err:''};renderSpeak();return}
  if(id==='newPrompt'){stopRec();sp={...sp,prompt:sp.prompt+1,heard:'',result:null,err:'',secs:0};renderSpeak();return}
  if(id!=='micBtn'||!SR)return;
  if(sp.rec){stopRec();return}
  window.speechSynthesis?.cancel();
  sp={...sp,heard:'',result:null,err:'',secs:0};
  const free=sp.mode==='free';
  sp.rec=listen({continuous:free,
    onText:t=>{sp.heard=t;const h=document.querySelector('#v-speak .heard');if(h)h.textContent=t},
    onError:code=>{sp.err=micMsg(code)},
    onEnd:t=>{clearInterval(sp.timer);sp.rec=null;sp.heard=t||sp.heard;sp.result=!!sp.heard;renderSpeak()}});
  if(free){sp.timer=setInterval(()=>{sp.secs++;const el=document.querySelector('#v-speak .timer');if(el)el.textContent=`${Math.floor(sp.secs/60)}:${String(sp.secs%60).padStart(2,'0')} / 1:00`;if(sp.secs>=60)stopRec()},1000)}
  renderSpeak();
});

  if(moreTab==='lib'){

     <div class="chips">${[[-1,L('كل المستويات','All levels')],...LV.map((l,i)=>[i,l])].map(([k,t])=>`<button class="chip" data-l="${k}" aria-pressed="${k===fLv}">${t}</button>`).join('')}</div>
     <div class="chips">${[['all',L('الكل','All')],...Object.entries(TYPES).map(([k,p])=>[k,tx(p)])].map(([k,t])=>`<button class="chip" data-t="${k}" aria-pressed="${k===fType}">${t}</button>`).join('')}</div>
     <div class="list" id="libList">${list.map(r=>itemHTML(r,true)).join('')||`<p class="muted">${L('مفيش حاجة بالاختيار ده.','Nothing matches.')}</p>`}</div>`;
    stagger($('libList'));
  }else{
    const M=[[L('استماع كتير تفهمه','Lots of listening you understand'),L('الكلام بييجي من الاستماع. لو فاهم أقل من ٧٠٪ انزل مستوى.','Speaking grows from listening. Understand under 70%? Go one level down.')],
      ['Shadowing',L('اسمع جملة، وقّف، قولها بنفس السرعة والنغمة. أسرع طريقة للنطق.','Hear a sentence, pause, say it with the same speed and tune. The fastest route to good pronunciation.')],
      [L('جمل مش كلمات','Sentences, not words'),L('"I ran out of time" أحسن من "run out = يخلص".','Learn "I ran out of time", not "run out = finish".')],
      [L('سجّل صوتك','Record yourself'),L('دقيقة كل أسبوع، واسمع القديم. هتلاقي أخطاءك بنفسك.','One minute a week. Compare with old recordings and spot your own mistakes.')],
      [L('فكّر بالإنجليزي','Think in English'),L('اوصف اللي بتعمله في دماغك: "I\'m making coffee".','Narrate in your head: "I\'m making coffee". This removes translation.')],
      [L('اختار لهجة واحدة','Pick one accent'),L('أمريكي أو بريطاني، والتزم بيها في الاستماع والتقليد.','American or British, and stay with it while listening and shadowing.')]];
    v.innerHTML=tabs+`<div class="sec-head"><h2>${L('الطرق اللي بتفرق فعلًا','What actually works')}</h2></div>
     <div class="methods">${M.map(([a,b])=>`<div class="panel"><strong>${a}</strong><p>${b}</p></div>`).join('')}</div>
     <div class="sec-head"><h2>${L('أصوات بتتعب العرب','Sounds Arabic speakers find hard')}</h2><small>${L('دوس واسمع، وبعدين قولها','Tap, listen, then say it')}</small></div>
     <div class="pairs">${PAIRS.map(w=>`<span class="pair"><button class="en" data-say="${w}">${w}</button><button data-say="${w}" data-slow="1">${L('بطيء','slow')}</button></span>`).join('')}</div>
     <div class="sec-head"><h2>${L('أمريكي ولا بريطاني؟','American or British?')}</h2><small>${L('دوس على الكلمة تسمعها باللهجة بتاعتها','Tap a word to hear it in its accent')}</small></div>
     <div class="tablewrap"><table><thead><tr><th>🇺🇸 US</th><th>🇬🇧 UK</th><th>${L('المعنى','Meaning')}</th></tr></thead><tbody>${USUK.map(([u,k,a])=>`<tr><td><button data-say="${u}" data-accent="us">${u}</button></td><td><button data-say="${k}" data-accent="uk">${k}</button></td><td>${a}</td></tr>`).join('')}</tbody></table></div>`;
  }
}
$('v-more').addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'),l=e.target.closest('[data-l]'),mt=e.target.closest('[data-mt]');
  if(mt)moreTab=mt.dataset.mt;else if(t)fType=t.dataset.t;else if(l){fLv=+l.dataset.l;store.set('fr-lv',fLv)}else return;
  renderMore();
});

/* =========================================================
   placement test
   ========================================================= */
const UOE_N=16, LIS_N=8;
let tst=null;
function newTest(){
  return {step:'intro',wrong:[],
    vocab:shuffle(VOCAB.map(([band,w])=>({band,w}))),vi:0,vans:[],
    ubank:UOE.map((x,j)=>({lvl:x[0],q:x[1],p:x[2],opts:x[3],b:bOf(x[0],j)})),uused:new Set(),uresp:[],ucur:null,
    lbank:LISTEN.map((x,j)=>({lvl:x[0],text:x[1],q:x[2],opts:x[3],b:bOf(x[0],j*2)})),lused:new Set(),lresp:[],lcur:null,plays:0,
    order:null};
}
function testBar(done,total,label){return `<div class="t-top"><span>${label}</span><span class="en">${done} / ${total}</span></div><div class="t-bar"><i style="width:${done/total*100}%"></i></div>`}
function renderTest(){
  if(!tst)tst=newTest();
  const v=$('v-test');
  if(tst.step==='intro'){
    v.innerHTML=`<div class="stack">
      <div class="sec-head"><h2>${L('اختبار تحديد المستوى','Placement test')}</h2><small>${L('حوالي ٢٠ دقيقة','About 20 minutes')}</small></div>
      <p>${L('الاختبار بيتغير على حسب إجاباتك زي الاختبارات الرسمية: لو جاوبت صح السؤال الجاي بيصعب، ولو غلط بيسهل. كده بيوصل لمستواك بأسئلة أقل وبدقة أعلى.','The test adapts like official computer tests: a right answer makes the next question harder, a wrong one makes it easier. This finds your level with fewer questions and more accuracy.')}</p>
      <ol class="intro-list">
        <li><span><strong>${L('الكلمات','Vocabulary')}</strong><br><span class="muted">${L('٨٠ كلمة: قول لو عارف معناها. فيه كلمات مش حقيقية متحطوطة عشان تكشف التخمين، فمتقولش "عارفها" غير لو متأكد.','80 words: say if you know the meaning. Some are fake words that catch guessing, so only say yes if you are sure.')}</span></span></li>
        <li><span><strong>${L('القواعد والقراية','Grammar & reading')}</strong><br><span class="muted">${L(`${UOE_N} سؤال بتتكيّف على مستواك.`,`${UOE_N} questions that adapt to you.`)}</span></span></li>
        <li><span><strong>${L('الاستماع','Listening')}</strong><br><span class="muted">${L(`${LIS_N} جمل بصوت ${S.accent==='uk'?'بريطاني':'أمريكي'}، تقدر تسمع كل جملة مرتين بس.`,`${LIS_N} clips in a ${S.accent==='uk'?'British':'American'} voice. Each plays twice at most.`)}</span></span></li>
      </ol>
      <p class="note">${L('متستخدمش قاموس ولا ترجمة، وجاوب بسرعة. لو مش عارف اختار أقرب إجابة. النتيجة هتكون مستواك في الإطار الأوروبي (CEFR) من A1 لـ C2.','No dictionary or translator, answer fast. If unsure, pick the closest answer. You get a CEFR level from A1 to C2.')}</p>
      <button class="btn big wide" id="tStart">${L('يلا نبدأ','Start')}</button>
     </div>`;
  }else if(tst.step==='vocab'){
    const it=tst.vocab[tst.vi];
    v.innerHTML=testBar(tst.vi,tst.vocab.length,L('١ · الكلمات','1 · Vocabulary'))+`
      <p class="muted" style="text-align:center">${L('تعرف معنى الكلمة دي؟','Do you know what this word means?')}</p>
      <p class="lex" dir="ltr" key="${tst.vi}">${esc(it.w)}</p>
      <div class="yn"><button class="btn big ghost" data-yn="0">${L('لأ / مش كلمة','No / not a word')}</button><button class="btn big" data-yn="1">${L('أيوه، عارفها','Yes, I know it')}</button></div>`;
  }else if(tst.step==='uoe'){
    if(tst.ucur===null){const th=tst.uresp.length?eap(tst.uresp).theta:-0.5;tst.ucur=pickItem(tst.ubank,tst.uused,th);tst.order=shuffle(tst.ubank[tst.ucur].opts.map((o,i)=>i))}
    const it=tst.ubank[tst.ucur];
    const q=esc(it.q).replace('___','<span class="gap"></span>');
    v.innerHTML=testBar(tst.uresp.length,UOE_N,L('٢ · القواعد والقراية','2 · Grammar & reading'))+`<div dir="ltr" class="ltr view">
      ${it.p?`<div class="passage">${esc(it.p)}</div>`:''}<p class="q">${q}</p>
      <div class="opts">${tst.order.map(i=>`<button class="opt" data-opt="${i}">${esc(it.opts[i])}</button>`).join('')}</div></div>`;
  }else if(tst.step==='listen'){
    if(tst.lcur===null){const th=tst.lresp.length?eap(tst.lresp).theta:-0.5;tst.lcur=pickItem(tst.lbank,tst.lused,th);tst.order=shuffle([0,1,2,3]);tst.plays=0}
    const it=tst.lbank[tst.lcur];
    v.innerHTML=testBar(tst.lresp.length,LIS_N,L('٣ · الاستماع','3 · Listening'))+`
      <button class="play" id="tPlay" aria-label="Play" ${tst.plays>=2?'disabled style="opacity:.4"':''}><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <p class="muted" style="text-align:center;margin-bottom:18px">${tst.plays===0?L('دوس واسمع الجملة','Tap to hear the clip'):L(`فاضل ${2-tst.plays} مرة`,`${2-tst.plays} play(s) left`)}</p>
      <div dir="ltr" class="ltr" ${tst.plays?'':'hidden'}><p class="q">${esc(it.q)}</p>
      <div class="opts">${tst.order.map(i=>`<button class="opt" data-lopt="${i}">${esc(it.opts[i])}</button>`).join('')}</div></div>
      ${'speechSynthesis' in window?'':`<p class="note">${L('المتصفح ده مش بيشغّل صوت، فجزء الاستماع مش هينفع.','This browser cannot play speech, so listening will not work.')}</p>`}`;
  }else if(tst.step==='result'){
    const r=tst.res,lvl=r.o.level;
    const bar=(name,score,extra)=>`<div class="b"><div><span>${name}</span><strong class="en">${LV[Math.floor(score)]}</strong></div><div class="line"><i style="width:${Math.max(4,score/6*100)}%;background:var(--accent)"></i></div>${extra?`<small class="muted">${extra}</small>`:''}</div>`;
    v.innerHTML=`<div class="stack" style="text-align:center">
      <p class="muted">${L('مستواك','Your level')}</p>
      <div class="result-badge en">${LV[lvl]}</div>
      <p style="max-width:52ch;margin:0 auto">${tx(CANDO[lvl])}</p>
      <p class="muted" style="font-size:14px">${L('دقة النتيجة: ','Confidence: ')}<strong>${{high:L('عالية','high'),mid:L('متوسطة','medium'),low:L('ضعيفة، يُفضل تعيد الاختبار','low, consider retaking')}[r.o.conf]}</strong></p>
     </div>
     <div class="panel bars" style="margin-top:18px">
      ${bar(L('الكلمات','Vocabulary'),r.v.score,L(`حوالي ${r.v.size.toLocaleString()} كلمة من أشهر ٥٠٠٠`,`About ${r.v.size.toLocaleString()} of the 5,000 most common words`)+(r.v.fa>=0.25?L(' · قلت "عارفها" لكلمات مش حقيقية، فالجزء ده أقل دقة',' · you said yes to fake words, so this part is less precise'):''))}
      ${bar(L('القواعد والقراية','Grammar & reading'),r.u.score)}
      ${bar(L('الاستماع','Listening'),r.l.score)}
      <div class="scale en">${LV.slice(0,6).map(l=>`<span>${l}</span>`).join('')}</div>
     </div>
     ${tst.wrong.length?`<details class="panel review" style="margin-top:14px"><summary>${L(`راجع أخطائك (${tst.wrong.length})`,`Review your mistakes (${tst.wrong.length})`)}</summary><ul dir="ltr">${tst.wrong.map(w=>`<li><span class="tag">${LV[w.lvl]}</span> ${esc(w.q.replace('___','_____'))}<br><span style="color:var(--bad)">✗ ${esc(w.you)}</span> · <span style="color:var(--ok)">✓ ${esc(w.ans)}</span>${w.say?` · <button class="btn ghost" style="padding:2px 10px" data-say="${esc(w.say)}">▶</button>`:''}</li>`).join('')}</ul></details>`:''}
     <p class="note" style="margin-top:14px">${L('الاختبار ده بيقيس الفهم والقواعد والكلمات. الكلام نفسه اتدرب عليه وقيسه في صفحة "تدريب" بالمايك.','This test measures understanding, grammar and vocabulary. Practise and measure speaking on the Practice page with the mic.')}</p>
     <div class="row" style="margin-top:14px"><button class="btn ghost" id="tAgain">${L('اعيد الاختبار','Retake')}</button><button class="btn" id="tApply">${L(`ابدأ من مرحلة ${LV[lvl]}`,`Start at ${LV[lvl]}`)}</button></div>`;
  }
}
function finishTest(){
  const v=vocabScore(tst.vans);
  const ue=eap(tst.uresp),le=eap(tst.lresp);
  const u={score:thetaScore(ue.theta),sd:ue.sd},l={score:thetaScore(le.theta),sd:le.sd};
  tst.res={v,u,l,o:overall(v,u,l)};tst.step='result';
  store.set('fr-lastTest',{date:today(),level:tst.res.o.level,score:+tst.res.o.score.toFixed(2),v:+v.score.toFixed(2),u:+u.score.toFixed(2),l:+l.score.toFixed(2)});
}
$('v-test').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!tst)return;
  if(b.id==='tStart'){tst.step='vocab'}
  else if(b.dataset.yn!==undefined){tst.vans.push({band:tst.vocab[tst.vi].band,yes:b.dataset.yn==='1'});tst.vi++;if(tst.vi>=tst.vocab.length)tst.step='uoe'}
  else if(b.dataset.opt!==undefined){const it=tst.ubank[tst.ucur];tst.uused.add(tst.ucur);
    if(b.dataset.opt!=='0')tst.wrong.push({lvl:it.lvl,q:(it.p?it.p+' — ':'')+it.q,you:it.opts[+b.dataset.opt],ans:it.opts[0]});tst.uresp.push({b:it.b,ok:b.dataset.opt==='0'});tst.ucur=null;if(tst.uresp.length>=UOE_N)tst.step='listen'}
  else if(b.id==='tPlay'){if(tst.plays>=2)return;const it=tst.lbank[tst.lcur];tst.plays++;say(it.text,{rate:[.85,.9,.98,1.05,1.1,1.15][it.lvl]})}
  else if(b.dataset.lopt!==undefined){const it=tst.lbank[tst.lcur];tst.lused.add(tst.lcur);
    if(b.dataset.lopt!=='0')tst.wrong.push({lvl:it.lvl,q:'🔊 "'+it.text+'" — '+it.q,you:it.opts[+b.dataset.lopt],ans:it.opts[0],say:it.text});tst.lresp.push({b:it.b,ok:b.dataset.lopt==='0'});tst.lcur=null;window.speechSynthesis?.cancel();if(tst.lresp.length>=LIS_N)finishTest()}
  else if(b.id==='tAgain'){tst=newTest()}
  else if(b.id==='tApply'){place={level:tst.res.o.level,date:today()};store.set('fr-place',place);fLv=null;location.hash='today';renderAll();return}
  else return;
  renderTest();
});
document.addEventListener('keydown',e=>{if(location.hash!=='#test'||!tst||tst.step!=='vocab')return;const k=e.key.toLowerCase();if(k==='y'||k==='n'){const btn=document.querySelector(`[data-yn="${k==='y'?1:0}"]`);btn&&btn.click()}});

/* =========================================================
   routing
   ========================================================= */
const VIEWS=['today','path','speak','words','more','test'];
let shown=null;
function markNav(){const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'today';document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'))}
function route(){
  const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'today';
  if(v!=='speak')stopRec();
  VIEWS.forEach(x=>{const el=$('v-'+x);el.hidden=x!==v});
  const el=$('v-'+v);el.classList.remove('view');void el.offsetWidth;el.classList.add('view');
  if(v==='test')renderTest();
  markNav();if(shown!==null)window.scrollTo(0,0);shown=v;
}
function renderAll(){renderShell();renderToday();renderPath();renderWords();renderSpeak();renderMore();if(tst)renderTest();route()}
window.addEventListener('hashchange',route);
renderAll();
</script>
