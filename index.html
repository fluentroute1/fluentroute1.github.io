<style>
/* Layout: app shell. Ink header band (brand, language + accent switches, progress ring); one column of views; tab bar fixed at the bottom on phones, sticky on top on desktop */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --sunk:#F5F7FB; --ink:#121935; --muted:#5D6684; --line:#DCE1EC;
  --band:#121935; --band-fg:#F4F6FC; --band-muted:#A9B1CF; --band-line:rgba(255,255,255,.16);
  --accent:#2F4FE0; --accent-soft:#E4E9FF; --marker:#FFD84A; --marker-ink:#121935;
  --ok:#17885A; --ok-soft:#DDF3E8; --bad:#C9373B; --bad-soft:#FBE3E3;
  --f-display:"Baloo Bhaijaan 2","Readex Pro","Segoe UI",Tahoma,sans-serif;
  --f-body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"Readex Pro","Segoe UI",Tahoma,sans-serif; /* numbers use tabular figures, no code font */
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#151C32; --sunk:#10162A; --ink:#E8ECF6; --muted:#98A1BE; --line:#262F4C;
  --band:#151C32; --band-fg:#F4F6FC; --band-muted:#98A1BE; --band-line:rgba(255,255,255,.12);
  --accent:#8FA3FF; --accent-soft:#222C55; --marker:#F2CC3D; --marker-ink:#121935;
  --ok:#4BC48A; --ok-soft:#173A2B; --bad:#FF7A7E; --bad-soft:#3E1B22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#151C32; --sunk:#10162A; --ink:#E8ECF6; --muted:#98A1BE; --line:#262F4C;
  --band:#151C32; --band-fg:#F4F6FC; --band-muted:#98A1BE; --band-line:rgba(255,255,255,.12);
  --accent:#8FA3FF; --accent-soft:#222C55; --marker:#F2CC3D; --marker-ink:#121935;
  --ok:#4BC48A; --ok-soft:#173A2B; --bad:#FF7A7E; --bad-soft:#3E1B22; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);text-align:start}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.en{unicode-bidi:isolate;font-family:var(--f-display)}
.ltr{direction:ltr;text-align:left}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2,h1.st{font:700 20px/1.35 var(--f-body);margin:0;text-wrap:balance}
h1.st{font-size:24px}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.sec-head:first-child{margin-top:0}
.sec-head small{color:var(--muted);font-size:13px}

/* motion */
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:.001}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 22px transparent}} /* taste-skill-ignore: pulse only while the mic records */
@keyframes shimmer{to{background-position:-200% 0}}
.view{animation:rise .38s var(--ease) both}
.stagger>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}

/* header band */
header{background:var(--band);color:var(--band-fg)}
header .wrap{padding-block:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body{font-variant-numeric:tabular-nums}
.brand{flex:1;min-width:150px;display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;flex:none;border-radius:13px}
.brand b{display:block;font:800 28px/1 var(--f-display);letter-spacing:-.01em;padding-top:4px}
.brand b span{color:var(--marker)}
.brand b{white-space:nowrap}
@media (max-width:999px){
  header .wrap{flex-wrap:nowrap;padding-block:14px}
  .brand{min-width:0}
  .brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ring{width:52px;height:52px}.ring div{width:41px;height:41px}.ring strong{font-size:14px}
}
@media (max-width:520px){
  .brand small{display:none}.brand svg{width:40px;height:40px}.brand b{font-size:24px}
  .brand{flex:1 0 auto}
  header .wrap{gap:10px}
  /* on phones the language switch shows only the language you can switch to */
  .switches .seg button[aria-pressed="true"]{display:none}
  .switches .seg button{color:var(--band-fg);padding:6px 12px}
  .cta{grid-template-columns:1fr}
}
.brand small{color:var(--band-muted);font-size:13px}
.switches{display:flex;gap:8px}
.seg{display:inline-flex;align-items:center;border:1px solid var(--band-line);border-radius:99px;padding:2px}
.seg button{border:0;background:transparent;color:var(--band-muted);padding:4px 11px;border-radius:99px;font:500 13px var(--f-mono);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--band-fg);color:var(--band)}
.seg.light{border-color:var(--line);background:var(--surface)}
.seg.light span{padding-inline:10px 4px;font-size:13px;color:var(--muted)}
.seg.light button{color:var(--muted);font:500 14px var(--f-body);padding:6px 12px}
.seg.light button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pb{display:flex;align-items:center;gap:12px}
.authbox{display:flex;align-items:center;gap:8px}
.authbox .motion-tgl{display:none}
.l-short{display:none}
@media (max-width:520px){header .pb{display:none}}
@media (max-width:999px){.authbox .l-long{display:none}.authbox .l-short{display:inline}.authbox .who span{display:none}}
@media (max-width:420px){.lp-bar .l-long{display:none}.lp-bar .l-short{display:inline}}
@media (min-width:1000px){.side .authbox{display:grid;gap:10px;order:4}.side .authbox .motion-tgl{display:block}}
.pb-text{display:none}
.pb-text strong{display:block;font:700 16px var(--f-display)}
.pb-text small{color:var(--band-muted);font-size:13px}
.ring{--p:0;width:60px;height:60px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--marker) calc(var(--p)*1%),var(--band-line) 0);transition:--p .8s} /* taste-skill-ignore: progress ring is a chart */
.ring div{width:47px;height:47px;border-radius:50%;background:var(--band);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring strong{font:600 16px var(--f-display)}
.ring em{font:normal 10px var(--f-mono);color:var(--band-muted)}

/* nav */
nav{position:fixed;inset:auto 0 0;z-index:6;background:var(--sunk);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:8px 6px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
nav a[aria-current="page"]{color:var(--accent)}
nav a[aria-current="page"] svg{transform:translateY(-2px)}
main .wrap{padding-block:22px 110px}
@media (min-width:760px){
  nav{position:sticky;top:env(safe-area-inset-top,0px);inset-inline:auto;bottom:auto;border-top:0;padding-bottom:0}
  nav .wrap{display:flex;gap:6px;padding-block:8px}
  nav a{flex-direction:row;gap:8px;font-size:15px;padding:8px 14px;border-radius:99px}
  nav a[aria-current="page"]{background:var(--accent-soft)}
  nav a[aria-current="page"] svg{transform:none}
  nav svg{width:18px;height:18px}
  main .wrap{padding-block:28px 64px}
}
.today-grid{display:grid;gap:14px}
.today-grid>.stack{align-content:start}

/* desktop: dark sidebar with brand, progress, nav and language; wide content area */
@media (min-width:1000px){
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:272px;background:var(--band);color:var(--band-fg);display:flex;flex-direction:column;overflow-y:auto;z-index:6;padding-top:env(safe-area-inset-top,0px)}
  .side header .wrap{flex-direction:column;align-items:stretch;gap:22px;padding:28px 22px 18px}
  .side .brand{min-width:0}
  .side .pb{background:rgba(255,255,255,.06);border-radius:16px;padding:14px}
  .side .pb-text{display:block}
  .side .switches{order:3}
  .side nav{position:static;background:transparent;border:0;padding:0}
  .side nav .wrap{display:flex;flex-direction:column;gap:4px;padding:6px 14px 24px}
  .side nav a{flex-direction:row;gap:12px;font-size:16px;padding:11px 14px;border-radius:12px;color:var(--band-muted)}
  .side nav a:hover{background:rgba(255,255,255,.06);color:var(--band-fg)}
  .side nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--band-fg)}
  .side nav a[aria-current="page"] svg{color:var(--marker)}
  .side nav svg{width:20px;height:20px}
  main{margin-inline-start:272px}
  main .wrap{max-width:1080px;padding:40px max(40px,env(safe-area-inset-right,0px)) 64px max(40px,env(safe-area-inset-left,0px))}
  .today-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px}
  #v-speak,#v-test,#v-words{max-width:760px;margin-inline:auto}
  .stages{grid-template-columns:1fr}
  h2{font-size:22px}
}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:var(--surface);transition:transform .15s,filter .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--ok);color:#fff}
.btn.big{padding:16px 22px;font-size:17px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* today */
.now{display:grid;gap:12px}
.lvl{display:flex;align-items:center;gap:14px}
.badge{font:700 22px/1 var(--f-display);background:var(--marker);color:var(--marker-ink);border-radius:12px;padding:12px;min-width:64px;text-align:center}
.line{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.line i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .6s var(--ease)}
.next{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.next b{color:var(--accent);flex:none}
.cta{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--marker);color:var(--marker-ink);border-radius:var(--r);padding:18px}
.cta p{font-size:15px}
.cta .btn{background:var(--marker-ink);color:var(--marker)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:background .25s,border-color .25s}
.task.done{background:var(--ok-soft);border-color:transparent}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s var(--ease)}
.tick svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3}
.task:not(.done) .tick svg{opacity:0}
.t-title{font-weight:700}
.t-sub{display:block;font-size:14px;color:var(--muted)}
.mins{font:500 13px var(--f-mono);color:var(--muted)}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
.stat strong{display:block;font:700 28px/1.1 var(--f-display)}
.stat span{font-size:14px;color:var(--muted)}
a.stat:hover{border-color:var(--accent)}

/* stages */
.stages{display:grid;gap:10px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage.current{border:2px solid var(--accent)}
.stage summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.stage summary::-webkit-details-marker{display:none}
.code{font:700 15px/1 var(--f-display);width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--sunk)}
.stage.current .code{background:var(--marker);color:var(--marker-ink)}
.stage.done .code{background:var(--ok);color:#fff}
.s-name{font-weight:700;font-size:17px;display:block}
.s-meta{font-size:13px;color:var(--muted)}
.s-count{font:500 13px var(--f-mono);color:var(--muted)}
.s-body{display:grid;gap:16px;padding:4px 16px 18px}
.label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.checks input{margin:4px 0 0;width:20px;height:20px;accent-color:var(--ok);flex:none}
.checks input:checked+span{color:var(--muted);text-decoration:line-through}
.picks,.list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.list{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.more{justify-self:start;font-weight:700;text-decoration:none}
.honest{border-inline-start:4px solid var(--marker);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px}

/* resources */
.item{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;min-width:0;transition:border-color .2s,transform .2s var(--ease)}
a.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .en{font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--muted);font-size:13px}
.tag{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}

/* chips + segmented tabs */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:14px;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

/* tips */
.methods{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.methods .panel{padding:14px 16px}
.methods strong{display:block;margin-bottom:2px}
.methods p{color:var(--muted);font-size:15px}
.pairs{display:flex;flex-wrap:wrap;gap:8px}
.pair{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.pair button{border:0;background:transparent;padding:7px 12px}
.pair button+button{border-inline-start:1px solid var(--line);color:var(--muted);font-size:12px}
.pair button:hover{background:var(--accent-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:13px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td button{border:0;background:transparent;padding:0;color:var(--accent);font-family:var(--f-display);font-weight:600}

/* flashcard flip */
.flip{perspective:1200px}
.flip-in{position:relative;min-height:270px;transition:transform .55s var(--ease);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face.back{visibility:hidden;transition:visibility 0s .27s}.flip.on .face.back{visibility:visible}.flip.on .face:not(.back){visibility:hidden;transition:visibility 0s .27s}
.word{font:800 clamp(30px,8vw,42px)/1.15 var(--f-display)}
.word span{text-decoration:underline .32em var(--marker);text-underline-offset:-.12em;text-decoration-skip-ink:none}
.ex{font-size:17px;color:var(--muted);font-family:var(--f-display)}
.ar{font-size:21px;font-weight:700}
.kind{font:500 12px var(--f-mono);color:var(--muted)}
.empty-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:40px 20px;text-align:center;display:grid;gap:6px}

/* speak */
.speak-card{display:grid;gap:16px;text-align:center;justify-items:center}
.target{font:600 clamp(20px,5vw,26px)/1.45 var(--f-display);max-width:32ch}
.target span{transition:color .25s,background .25s;border-radius:4px;padding:0 .08em}
.target .hit{color:var(--ok)}
.target .miss{color:var(--bad);background:var(--bad-soft)}
.mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.mic svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mic:active{transform:scale(.94)}
.mic.rec{background:var(--bad);animation:pulse 1.1s infinite}
.heard{min-height:1.6em;color:var(--muted);font-family:var(--f-display)}
.score{font:800 44px/1 var(--f-display);animation:pop .45s var(--ease)}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;text-align:start}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}

.lp-route.in .route-svg .road{stroke-dashoffset:0}
.stops{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:-6px}

.lp-route.in .stop b{transform:none;opacity:1}
.stop span{font-size:14px;color:var(--band-fg)}

html:not(.motion) .route-svg .road{stroke-dashoffset:0}

/* steps */
.lp-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0}
.lp-steps li{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:8px}

.lp-band{background:var(--marker);color:var(--marker-ink);border-radius:32px;padding:44px 32px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}

.lp-foot{padding-block:40px 56px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:900px){.lp-hero{grid-template-columns:1fr;gap:28px;padding-block:28px 48px}.lp-stage{min-height:360px}}

/* entrances: visible without script; with motion on they rise in once */
html.motion.js .rv{opacity:.001;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--d,0)*90ms)}

/* =========================================================

   ========================================================= */

.chara svg{width:clamp(104px,22vw,150px);height:auto;overflow:visible}
.chara .nm{font:700 15px var(--f-display);padding:3px 12px;border-radius:99px;background:var(--surface);color:var(--muted);transition:background .2s,color .2s}

.chara .mouth>*{display:none}
.chara svg[data-m="0"] .v0,.chara svg[data-m="M"] .vM,.chara svg[data-m="S"] .vS,.chara svg[data-m="E"] .vE,.chara svg[data-m="A"] .vA,.chara svg[data-m="O"] .vO,.chara svg[data-m="U"] .vU,.chara svg[data-m="F"] .vF{display:inline}
.chara .torso{animation:breathe 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

.chara .hd{transform:rotate(var(--tilt,0deg)) translateY(var(--nod,0px));transform-box:fill-box;transform-origin:50% 90%;transition:transform .14s ease-out}
.chara .eye{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.chara svg.blink .eye{transform:scaleY(.08)}
.chara .pupil{transform:translate(var(--gx,0px),var(--gy,0px));transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.chara .arm{transform-box:view-box;transform-origin:120px 158px;transition:transform .38s cubic-bezier(.3,.7,.2,1)}
.chara svg.gest .arm{transform:rotate(-46deg)}
.chara .brows{transition:transform .18s ease-out}
.chara svg.brow .brows{transform:translateY(-3.5px)}
@keyframes breathe{50%{transform:scaleY(1.025)}}
@keyframes sway{25%{transform:rotate(-1.8deg)}75%{transform:rotate(1.8deg)}}
/* personal map */
.maphead{display:flex;gap:14px;align-items:center}

.guide{position:absolute;inset-inline-start:calc(100% + 4px);top:-14px;display:grid;justify-items:center;width:86px;pointer-events:none}

   scoring (pure functions + self-checks)
   ========================================================= */
// Adaptive test: 3-parameter-style model with fixed guessing (4 options), EAP ability estimate on a grid
const GRID=[];for(let t=-4;t<=4.0001;t+=0.1)GRID.push(+t.toFixed(1));
const GUESS=0.25;
const pCorrect=(th,b)=>GUESS+(1-GUESS)/(1+Math.exp(-1.7*(th-b)));
function eap(resp){ // resp: [{b, ok}] -> {theta, sd}
  const w=GRID.map(t=>{let l=Math.exp(-t*t/(2*2.25));for(const r of resp){const p=pCorrect(t,r.b);l*=r.ok?p:1-p}return l});
  const den=w.reduce((a,b)=>a+b,0);
  const m=GRID.reduce((a,t,i)=>a+t*w[i],0)/den;
  return {theta:m,sd:Math.sqrt(GRID.reduce((a,t,i)=>a+(t-m)**2*w[i],0)/den)};
}
const bOf=(lvl,j)=>lvl-2.5+((j%5)-2)*0.12;              // A1..C2 centred at -2.5..2.5
const thetaScore=th=>Math.max(0,Math.min(5.99,th+3));    // continuous 0..6; floor = level index
function pickItem(bank,used,theta){
  let best=-1,bd=1e9;
  bank.forEach((it,i)=>{if(used.has(i))return;const d=Math.abs(it.b-theta)+Math.random()*0.2;if(d<bd){bd=d;best=i}});
  return best;
}
// Vocabulary: per-band hit rate corrected by false alarms on made-up words, scaled to Milton's 5,000-word CEFR bands
const VCUTS=[0,1500,2500,3250,3750,4500,5000];
function vocabScore(ans){ // ans: [{band, yes}]
  const rate=b=>{const a=ans.filter(x=>x.band===b);return a.length?a.filter(x=>x.yes).length/a.length:0};
  const fa=rate(0);
  const adj=b=>fa>=0.99?0:Math.max(0,Math.min(1,(rate(b)-fa)/(1-fa)));
  const size=Math.round([1,2,3,4,5].reduce((s,b)=>s+adj(b)*1000,0));
  const rare=adj(6);
  let score;
  if(size>=4500)score=rare>=0.6?5+Math.min(0.99,(rare-0.6)/0.4):4.99;
  else{let i=0;while(size>=VCUTS[i+1])i++;score=i+(size-VCUTS[i])/(VCUTS[i+1]-VCUTS[i])}
  return {size,rare,fa,score:Math.min(5.99,score)};
}
function overall(v,u,l){ // weighted by how much each section tells us
  const s=0.45*u.score+0.30*l.score+0.25*v.score;
  const spread=Math.max(u.score,l.score,v.score)-Math.min(u.score,l.score,v.score);
  const conf=(spread<1.2&&u.sd<0.7&&v.fa<0.25)?'high':(spread<2&&v.fa<0.4)?'mid':'low';
  return {score:s,level:Math.floor(s),conf};
}
// Speaking: longest common subsequence between target words and what the mic heard
const toWords=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
function matchWords(target,heard){
  const n=target.length,m=heard.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=target[i]===heard[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(target[i]===heard[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return hit;
}
(function selfCheck(){
  const sim=trueTh=>{const bank=UOE.map((x,j)=>({b:bOf(x[0],j)}));const used=new Set(),resp=[];let th=-0.5;
    for(let k=0;k<16;k++){const i=pickItem(bank,used,th);used.add(i);resp.push({b:bank[i].b,ok:bank[i].b<trueTh});th=eap(resp).theta}
    return Math.floor(thetaScore(th))};
  console.assert(sim(9)===5,'cat: all correct -> C2');
  console.assert(sim(-9)===0,'cat: all wrong -> A1');
  console.assert(sim(0.5)===3,'cat: B2 responder -> B2');
  const allYes=VOCAB.map(([band])=>({band,yes:true}));
  console.assert(vocabScore(allYes).size===0,'vocab: saying yes to everything scores 0');
  const honest=VOCAB.map(([band])=>({band,yes:band>=1&&band<=3}));
  console.assert(Math.floor(vocabScore(honest).score)===2,'vocab: knows 3,000 words -> B1');
  console.assert(matchWords(['i','like','tea'],['i','tea']).join()===[true,false,true].join(),'speak: word match');
})();

const accentLang=a=>(a||S.accent)==='uk'?'en-GB':'en-US';
// voice quality: Edge's "Online (Natural)" voices are the clearest, then Google's, then the rest.
// Only voices of the chosen accent are used, so American stays American and British stays British.
const vScore=v=>(/natural|online|neural/i.test(v.name)?100:0)+(/google/i.test(v.name)?60:0)+(/microsoft/i.test(v.name)?10:0)+(v.localService?0:5);
const accentVoices=a=>{const re=new RegExp(accentLang(a).replace('-','[-_]'),'i');return voices.filter(v=>re.test(v.lang)).sort((x,y)=>vScore(y)-vScore(x))};
const goodVoice=a=>{const v=accentVoices(a)[0];return !!v&&vScore(v)>=60};
console.assert(vScore({name:'Microsoft Aria Online (Natural) - English (United States)',localService:false})>vScore({name:'Google US English',localService:false})&&vScore({name:'Google US English'})>vScore({name:'Microsoft David - English (United States)',localService:true}),'voice ranking');
function voiceNote(){

  return '';
}
function say(text,opts={}){
  const {slow=false,rate,accent,onend,vary=false}=opts;
  if(!('speechSynthesis' in window)){onend&&onend();return}
  if(!voices.length&&!opts._retry){loadVoices();if(!voices.length){setTimeout(()=>{loadVoices();say(text,{...opts,_retry:true})},350);return}}
  speechSynthesis.cancel();
  const all=accentVoices(accent);
  const u=new SpeechSynthesisUtterance(text);u.lang=accentLang(accent);u.rate=rate||(slow?.7:.9);u.pitch=1;
  const top=all.slice(0,Math.min(all.length,3));
  const v=vary&&top.length?top[Math.floor(Math.random()*top.length)]:all[0];
  if(v)u.voice=v;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,{slow:!!b.dataset.slow,accent:b.dataset.accent})});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen({continuous=false,onText,onEnd,onError}){
  const r=new SR();r.lang=accentLang();r.interimResults=true;r.continuous=continuous;r.maxAlternatives=1;
  let finalText='';
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}onText(finalText+interim)};
  r.onerror=e=>onError&&onError(e.error);
  r.onend=()=>onEnd&&onEnd(finalText.trim());
  try{r.start()}catch(e){onError&&onError('start')}
  return r;
}

    const ta=$('dInput');if(ta){ta.addEventListener('input',()=>{sp.dTyped=ta.value});ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('dCheck').click()}})}

// Dictation pool: practice sentences + listening clips of the chosen level
const dictPool=lv=>SENTS[lv].concat(LISTEN.filter(x=>x[0]===lv).map(x=>x[1]));
// Ear training: minimal pairs Arabic speakers confuse; each play uses a random voice of the accent (high-variability training)
const EAR=[['pin','bin'],['pea','bee'],['park','bark'],['very','berry'],['fan','van'],['fine','vine'],['think','sink'],['three','tree'],['thin','tin'],['ship','sheep'],['sit','seat'],['live','leave'],['full','fool'],['pull','pool'],['bed','bad'],['cat','cut'],['walk','work'],['hat','hut'],['cap','cup'],['letter','litter']];
const EAR_ROUND=10;
function newEar(){const p=shuffle(EAR)[0];return {pair:p,word:p[Math.random()<.5?0:1],picked:null,n:sp.ear?.n>=EAR_ROUND?0:(sp.ear?.n||0),right:sp.ear?.n>=EAR_ROUND?0:(sp.ear?.right||0)}}
function stopRec(){if(sp.rec){try{sp.rec.stop()}catch(e){}}}
$('v-speak').addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]'),lv=e.target.closest('[data-slv]');
  if(m){stopRec();sp={...sp,mode:m.dataset.mode,heard:'',result:null,err:'',secs:0,dTyped:'',dCheck:false};renderSpeak();return}
  if(lv){stopRec();sp={...sp,lv:+lv.dataset.slv,idx:0,prompt:0,heard:'',result:null,err:'',secs:0,dIdx:0,dTyped:'',dCheck:false};renderSpeak();return}
  const id=e.target.closest('button')?.id;
  // dictation
  const dTarget=()=>{const p=dictPool(speakLevel());return p[sp.dIdx%p.length]};
  if(id==='dPlay'){say(dTarget());return}
  if(id==='dSlow'){say(dTarget(),{slow:true});return}
  if(id==='dCheck'){sp.dCheck=true;renderSpeak();return}
  if(id==='dRetry'){sp.dCheck=false;sp.dTyped='';renderSpeak();$('dInput')?.focus();return}
  if(id==='dNext'){sp.dIdx++;sp.dCheck=false;sp.dTyped='';renderSpeak();say(dTarget());return}
  // ear training
  const ew=e.target.closest('[data-ear]');
  if(ew&&sp.ear&&!sp.ear.picked){sp.ear.picked=ew.dataset.ear;sp.ear.n++;if(sp.ear.picked===sp.ear.word)sp.ear.right++;renderSpeak();return}
  if(id==='earPlay'){say(sp.ear.word,{vary:true});return}
  if(id==='earNext'){sp.ear=newEar();renderSpeak();say(sp.ear.word,{vary:true});return}
  if(id==='earNew'){sp.ear=null;renderSpeak();return}
  if(id==='nextSent'){sp={...sp,idx:sp.idx+1,heard:'',result:null,err:''};renderSpeak();return}
  if(id==='again2'){sp={...sp,heard:'',result:null,err:''};renderSpeak();return}
  if(id==='newPrompt'){stopRec();sp={...sp,prompt:sp.prompt+1,heard:'',result:null,err:'',secs:0};renderSpeak();return}
  if(id!=='micBtn'||!SR)return;
  if(sp.rec){stopRec();return}
  window.speechSynthesis?.cancel();
  sp={...sp,heard:'',result:null,err:'',secs:0};
  const free=sp.mode==='free';
  sp.rec=listen({continuous:free,
    onText:t=>{sp.heard=t;const h=document.querySelector('#v-speak .heard');if(h)h.textContent=t},
    onError:code=>{sp.err=micMsg(code)},
    onEnd:t=>{clearInterval(sp.timer);sp.rec=null;sp.heard=t||sp.heard;sp.result=!!sp.heard;renderSpeak()}});
  if(free){sp.timer=setInterval(()=>{sp.secs++;const el=document.querySelector('#v-speak .timer');if(el)el.textContent=`${Math.floor(sp.secs/60)}:${String(sp.secs%60).padStart(2,'0')} / 1:00`;if(sp.secs>=60)stopRec()},1000)}
  renderSpeak();
});

function voiceFor(name){

  // two characters of the same gender get two different voices when the browser has them,
  // otherwise the second one speaks a little higher or lower so you can still tell them apart
  const c=CHARS[name],all=accentVoices();
  const pool=all.filter(v=>voiceGender(v)===c.g);

  if(pool.length)return {voice:pool[same%pool.length],pitch:pool.length>1||same===0?1:(c.g==='f'?1.1:.88)};

  return {voice:all[0]||null,pitch:c.g==='m'?.72:1.15};

/* ---------- lifelike animation engine ----------
   lip sync: each spoken word (from the speech engine's word-boundary events) is turned into a
   sequence of mouth shapes from its letters, timed to the speaking rate; if a voice sends no word
   events, the whole line is played through on the same timing.
   life: random blinks, small glances, listeners look at the speaker, the speaker looks back,
   the head tilts with how open the mouth is, the hand and eyebrows move on some words. */
const VISEME=ch=>/[ah]/.test(ch)?'A':/[eiy]/.test(ch)?'E':/o/.test(ch)?'O':/[uwq]/.test(ch)?'U':/[fv]/.test(ch)?'F':/[mbp]/.test(ch)?'M':/[a-z]/.test(ch)?'S':null;
const OPEN={A:1,O:.85,E:.6,U:.45,S:.35,F:.3,M:0,'0':0};
function visemesFor(word){const out=[];for(const ch of word.toLowerCase()){const v=VISEME(ch);if(v&&v!==out[out.length-1])out.push(v)}return out.length?out:['S']}
console.assert(visemesFor('hello').join('')==='AESO','lip sync: hello -> A E S O');
console.assert(visemesFor('mama').join('')==='MAMA'&&visemesFor('').join('')==='S','lip sync: repeats and empty');
let lipTimers=[];
const clearLips=()=>{lipTimers.forEach(clearTimeout);lipTimers=[]};
function setMouth(svg,v){svg.dataset.m=v;const o=OPEN[v]??.3;svg.style.setProperty('--tilt',(-o*3)+'deg');svg.style.setProperty('--nod',(-o*1.6)+'px')}

  const seq=visemesFor(word),step=Math.max(55,(word.length*62/Math.max(.5,rate))/seq.length);
  seq.forEach((v,i)=>lipTimers.push(setTimeout(()=>setMouth(svg,v),i*step)));
  lipTimers.push(setTimeout(()=>setMouth(svg,'S'),seq.length*step));
  if(Math.random()<.3){svg.classList.add('gest');lipTimers.push(setTimeout(()=>svg.classList.remove('gest'),700))}
  if(Math.random()<.18){svg.classList.add('brow');lipTimers.push(setTimeout(()=>svg.classList.remove('brow'),380))}
}
function lipLine(svg,text,rate){ // fallback when the voice gives no word timings
  let t=0;text.split(/\s+/).forEach(w=>{const d=Math.max(160,w.length*62/rate);lipTimers.push(setTimeout(()=>lipWord(svg,w,rate),t));t+=d+90/rate});

// who looks where: listeners turn their eyes to the speaker, the speaker to the nearest listener
function lookAt(root,speakerEl){
  const cs=[...root.querySelectorAll('.chara')];
  cs.forEach(c=>{const s=c.querySelector('svg');
    if(!speakerEl){s.style.setProperty('--gx','0px');return}
    const target=c===speakerEl?cs.find(x=>x!==c):speakerEl;
    if(!target){s.style.setProperty('--gx','0px');return}
    const dx=target.getBoundingClientRect().left-c.getBoundingClientRect().left;
    s.style.setProperty('--gx',(dx>0?2.4:-2.4)+'px');s.style.setProperty('--gy','.4px')});

function mouthLoop(el,root=document){ // el = the character now speaking, or null for silence
  clearLips();

function playLines(lines,{rate=.92,root=document,onDone,onLine}={}){
  if(!('speechSynthesis' in window)){onDone&&onDone();return}
  if(!voices.length)loadVoices();

    u.onstart=()=>{const el=root.querySelector(`.chara[data-char="${n}"]`);mouthLoop(el,root);onLine&&onLine(i);

function finishTest(){
  const v=vocabScore(tst.vans),ue=eap(tst.uresp),le=eap(tst.lresp);
  const parts={vocab:{score:v.score,w:.15},ctest:{score:stepScore(tst.cAtt),w:.2},uoe:{score:thetaScore(ue.theta),sd:ue.sd,w:.25},listen:{score:thetaScore(le.theta),sd:le.sd,w:.25},dict:{score:stepScore(tst.dAtt),w:.15}};
  if(tst.sAtt.length){const a=tst.sAtt;parts.speak={score:Math.min(5.99,a[1]?.pct>=.85?4.6:a[0].pct>=.85?2.8+(a[1]?.pct||0)*1.4:a[0].pct*2.6),w:.1}}
  tst.res={v,parts,o:overall6(parts)};tst.step='result';clearSavedTest();
  store.set('fr-lastTest',{date:today(),level:tst.res.o.level,score:+tst.res.o.score.toFixed(2),parts:Object.fromEntries(Object.entries(parts).map(([k,p])=>[k,+p.score.toFixed(2)]))});
  confetti();
}

  else if(b.id==='dtDone'){const hit=matchWords(toWords(tst.dSent),toWords(tst.dTyped)),pct=hit.filter(Boolean).length/hit.length;
    tst.dAtt.push({lvl:tst.dLvl,pct,s:tst.dSent});if(pct<1)tst.wrong.push({lvl:tst.dLvl,q:L('إملاء','Dictation'),you:tst.dTyped,ans:tst.dSent,say:tst.dSent});

    tst.sRec=listen({onText:t=>{tst.sHeard=t;const h=testEl().querySelector('.heard');if(h)h.textContent=t},onError:c=>{tst.sHeard='';toast(micMsg(c))},onEnd:t=>{tst.sRec=null;tst.sHeard=t||tst.sHeard;renderTest()}})}

/* small helpers: toast, confetti */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3800)}
function confetti(){
  if(!document.documentElement.classList.contains('motion'))return;
  const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#FFD84A','#2F4FE0','#17885A','#C9373B','#8FA3FF'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<150)requestAnimationFrame(tick);else c.remove()})();
}

const avgScore=(...p)=>{const v=p.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
function buildMap(res){
  const lvl=res.o.level,P=res.parts,all=res.o.score;
  const skill={gram:P.uoe?.score,vocab:P.vocab?.score,listen:avgScore(P.listen?.score,P.dict?.score),read:P.ctest?.score,speak:P.speak?.score};
  const weak=Object.entries(skill).filter(([,s])=>s!=null&&s<all-0.4).sort((a,b)=>a[1]-b[1]).map(([k])=>k);
  const units=[],push=(type,L,i=0,boost=false)=>units.push({id:`${boost?'b':''}${L}-${type}-${i}`,type,lvl:L,i,boost});
  if(weak.length){
    units.push({chapter:'boost'});
    const L=Math.max(0,lvl-1);
    weak.forEach(k=>{if(k==='gram'){push('gram',L,0,true);push('gram',L,1,true)}else push(k,L,0,true)});
  }
  for(let L=lvl;L<=5;L++){
    units.push({chapter:L});
    const order=['gram:0','vocab','gram:1','listen','gram:2','speak','gram:3','read','gram:4','write'].concat(L<=2?['pron']:[]);
    // weak skills move to the front of each chapter
    const rank=s=>{const k=s.split(':')[0],w=weak.indexOf(k);return w<0?99:w};
    order.map((s,i)=>[s,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).forEach(([s])=>{const [k,i]=s.split(':');push(k,L,+(i||0))});
  }
  return {built:today(),level:lvl,weak,units};
}

  const m=buildMap(fake);
  console.assert(m.weak[0]==='listen','map: weakest skill is listening');
  console.assert(m.units[0].chapter==='boost'&&m.units[1].type==='listen'&&m.units[1].lvl===1,'map: boost chapter starts with listening one level down');
  const firstB1=m.units.findIndex(u=>u.chapter===2);
  console.assert(m.units[firstB1+1].type==='listen','map: listening first inside the B1 chapter');

})();

function drawMapPath(){
  const box=$('map');if(!box)return;const r0=box.getBoundingClientRect();

  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],my=(y0+y1)/2;d+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`}

}

async function fbInit(){

async function pullCloud(){
  const ref=fb.F.doc(fb.db,'users',fbUser.uid),snap=await fb.F.getDoc(ref);
  const localAt=store.get('fr-updated',0);
  if(snap.exists()&&(snap.data().updatedAt||0)>localAt){
    const d=snap.data().data||{};let changed=false;
    SYNC_KEYS.forEach(k=>{if(k in d){const nv=JSON.stringify(d[k]);try{if(localStorage.getItem(k)!==nv){localStorage.setItem(k,nv);changed=true}}catch(_){}}});
    try{localStorage.setItem('fr-updated',JSON.stringify(snap.data().updatedAt))}catch(_){}
    if(changed)location.reload(); // simplest way to load the cloud progress into every screen
  }else pushCloud();
}

   ========================================================= */
const VIEWS=['home','today','path','speak','words','more','test'];
let shown=null;
// new visitors land on the landing page; returning learners go straight to Today
const hasProgress=()=>!!place||Object.keys(checks).length>0||Object.keys(srs).length>0||!!store.get('fr-lastTest',null);
const curView=()=>{const h=location.hash.slice(1);return VIEWS.includes(h)?h:'home'};
function markNav(){const v=curView();document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'))}
function route(){
  const v=curView();
  document.body.classList.toggle('on-home',v==='home');
  if(v!=='speak')stopRec();
  // only the screen in view is in the page (one h1 per screen, less work); the others are emptied
  VIEWS.forEach(x=>{const el=$('v-'+x);el.hidden=x!==v;if(x!==v)el.innerHTML=''});
  DRAW[v]();
  const el=$('v-'+v);el.classList.remove('view');void el.offsetWidth;el.classList.add('view');
  markNav();if(shown!==null)window.scrollTo(0,0);shown=v;
}
// each screen draws itself only while it is the one in view
const DRAW={home:renderHome,today:renderToday,path:renderPath,speak:renderSpeak,words:renderWords,more:renderMore,test:renderTest};
const onlyIf=(k,f)=>(...a)=>{if(curView()===k)return f(...a)};
renderHome=onlyIf('home',renderHome);renderToday=onlyIf('today',renderToday);renderPath=onlyIf('path',renderPath);renderWords=onlyIf('words',renderWords);renderSpeak=onlyIf('speak',renderSpeak);renderMore=onlyIf('more',renderMore);renderTest=onlyIf('test',renderTest);
function renderAll(){renderShell();route()}
window.addEventListener('hashchange',route);
renderAll();
